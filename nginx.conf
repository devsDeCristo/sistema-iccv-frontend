server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # SPA: rota desconhecida devolve o index.html em vez de 404.
    # É o equivalente ao redirect /* -> / do netlify.toml.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets do Vite têm hash no nome — cache longo é seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html fora do cache, senão o usuário fica preso numa versão antiga
    # apontando pra assets que já não existem.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
