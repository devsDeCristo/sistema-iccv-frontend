name: Build and publish Docker image

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  # GHCR do próprio repo (ghcr.io/felipeqq/ic-front) — autentica com GITHUB_TOKEN
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    # ubuntu-latest = linux/amd64 nativo, mesma arquitetura do servidor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_API_URL: cadastre em Settings > Secrets and variables >
          # Actions > Variables (não é secret, vai embutido no bundle mesmo)
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_MODULE_PAYMENT=${{ vars.VITE_MODULE_PAYMENT }}
          # provenance/sbom desligados de propósito: eles criam manifests
          # "untagged" extras no package, que confundem a limpeza por retenção
          # (e não agregam nada num build de plataforma única).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cada push cria uma versão nova de imagem (tag type=sha). Sem limpeza o
      # storage do package cresce indefinidamente — mantém só as 10 mais recentes.
      - name: Prune old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          # nunca apaga as tags de ambiente, mesmo se saírem das 10 recentes
          ignore-versions: '^(latest|main|homolog)$'
