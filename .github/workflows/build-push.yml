name: Build and publish Docker image

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  # GHCR do próprio repo (ghcr.io/devsdecristo/sistema-iccv-frontend) — autentica
  # com o GITHUB_TOKEN do job
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Espelhado em env porque `if:` não enxerga o contexto `secrets`. Enquanto o
  # secret não existir, o passo de deploy é pulado em vez de quebrar o build.
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

jobs:
  build-and-push-image:
    # ubuntu-latest = linux/amd64 nativo, mesma arquitetura do servidor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Só para o deploy: o nome do repo em minúsculas — devsDeCristo tem
      # maiúsculas e o Docker recusa referência que não seja minúscula.
      - name: Preparar variáveis do deploy
        run: |
          echo "IMAGE_LC=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_API_URL: cadastre em Settings > Secrets and variables >
          # Actions > Variables (não é secret, vai embutido no bundle mesmo)
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_MODULE_PAYMENT=${{ vars.VITE_MODULE_PAYMENT }}
          # provenance/sbom desligados de propósito: eles criam manifests
          # "untagged" extras no package, que confundem a limpeza por retenção
          # (e não agregam nada num build de plataforma única).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Troca a imagem do serviço no Swarm: o `docker service update` baixa a
      # imagem no nó, sobe a task nova e derruba a antiga — sem pull nem restart
      # separado. O stack file usa `order: start-first` no web, então o nginx
      # novo já está de pé antes do antigo sair: deploy sem janela de fora do ar.
      - name: Atualizar o serviço no Swarm
        if: github.ref == 'refs/heads/main' && env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Autenticação por senha (a mesma que a VM pede no terminal). Para
          # migrar pra chave depois: troque por `key:` com o conteúdo do
          # arquivo de chave privada, não com uma senha.
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            # O package é público, então o pull é anônimo e --with-registry-auth
            # não é necessário hoje. Fica pelo caso de fecharem o package: aí ele
            # repassa aos agentes do Swarm a credencial do ~/.docker/config.json.
            docker service update \
              --with-registry-auth \
              --force \
              --image ${{ env.IMAGE_LC }}:latest \
              sistema-eventos-iccv_web

      # Cada push cria uma versão nova de imagem (tag type=sha). Sem limpeza o
      # storage do package cresce indefinidamente — mantém só as 10 mais recentes.
      - name: Prune old package versions
        uses: actions/delete-package-versions@v5
        # No primeiro push de um repo novo o package ainda não existe e a action
        # retorna erro — isso não pode marcar o job como falho.
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          # nunca apaga as tags de ambiente, mesmo se saírem das 10 recentes
          ignore-versions: '^(latest|main|homolog)$'
